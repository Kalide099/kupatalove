<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - KupataLove</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { padding: 40px; text-align: center; }
    h1 { color: var(--primary); margin-bottom: 20px; }
    .content { max-width: 600px; margin: 0 auto; line-height: 1.6; }
    .back-link { display: inline-block; margin-top: 30px; color: var(--text); text-decoration: none; font-weight: 500; }
    .back-link:hover { color: var(--primary); }
    .form-group { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    input { padding: 10px 15px; width: 100%; max-width: 300px; border: 1px solid var(--border); border-radius: var(--radius-md); font-family: inherit; }
    button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-family: inherit; font-weight: 600; }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <h1>Forgot Password</h1>
  <div class="content">
    <p>Enter your email address to reset your password.</p>
    <div class="form-group">
      <input type="email" placeholder="Email address" id="email-input">
      <button onclick="alert('Password reset instructions have been sent to your email (Demo).')">Reset Password</button>
    </div>
  </div>
  <a href="/auth.html" class="back-link">← Back to Login</a>
</body>
</html>
